<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - AEGIS NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }
        
        .phone-screen {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            background: linear-gradient(180deg, #2a0a0a 0%, #1a0505 100%);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 8px solid #333;
        }
        
        .content-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            color: #ffffff;
            text-align: center;
        }
        
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1;
            margin-bottom: 10px;
        }
        
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .error-text {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 12px 24px;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .home-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        
        .icon-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .icon-link:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <div class="content-wrapper">
            <div class="error-code">404</div>
            <h1 class="error-title">Page introuvable</h1>
            <p class="error-text">
                La page que vous cherchez n'existe pas ou a été déplacée.<br>
                Revenez à l'accueil pour continuer.
            </p>
            <a href="/" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>
            <div class="social-icons">
                <a href="https://wa.me/8617858180592" target="_blank" class="icon-link"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://www.facebook.com/AegisNovaAurum" target="_blank" class="icon-link"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://www.tiktok.com/@angelina_a_k" target="_blank" class="icon-link"><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
